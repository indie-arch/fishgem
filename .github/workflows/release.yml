name: Desktop builds

on:
  push:
    branches: ['**']
    tags: ['v*']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          curl -fL --retry 3 "$base/SHA512-SUMS.txt" -o /tmp/SHA512-SUMS.txt
          cd /tmp
          mv godot.zip Godot_v4.7.2-stable_linux.x86_64.zip
          mv templates.tpz Godot_v4.7.2-stable_export_templates.tpz
          grep -E ' Godot_v4\.7\.2-stable_(linux\.x86_64\.zip|export_templates\.tpz)$' SHA512-SUMS.txt > selected-sums.txt
          test "$(wc -l < selected-sums.txt)" -eq 2
          sha512sum -c selected-sums.txt
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip -d godot-bin
          sudo install -m 755 godot-bin/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mv godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Import and run regression checks
        run: tools/check.sh
      - name: Build and package desktop binaries
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1' }}
        run: tools/build.sh "$RELEASE_TAG"
      - name: Smoke test Linux binary
        shell: bash
        run: |
          set -euo pipefail
          binary="$PWD/build/linux/FishGem.x86_64"
          cd "$(mktemp -d)"
          XDG_DATA_HOME="$PWD" timeout 60 "$binary" --headless --quit-after 10 2>&1 | tee smoke.log
          ! grep -Eq 'SCRIPT ERROR:|^ERROR:' smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: fishgem-desktop
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fishgem-desktop
          path: dist
      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Uploading binaries to existing release $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "FishGem $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
